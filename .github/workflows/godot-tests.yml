name: Godot Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: GUT Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: game

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path . --import

      - name: Run GUT tests
        run: |
          godot --headless --path . \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit \
            -gexit