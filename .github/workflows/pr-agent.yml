name: PR Agent

on:
  pull_request:
    types: [ready_for_review]

  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.sender.type != 'Bot' &&
      contains(fromJSON('["/review", "/describe", "/improve", "/ask"]'),
        split(github.event.comment.body, ' ')[0])

    runs-on: ubuntu-latest

    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          config.model: "gemini/gemini-3.6-flash"
          config.fallback_models: '["gemini/gemini-3.5-flash-lite"]'

          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["ready_for_review"]'
