name: PR Agent

on:
  pull_request:
    types: [ready_for_review]

  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent:
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          (
            github.event.comment.body == '/review' ||
            startsWith(github.event.comment.body, '/review ') ||
            github.event.comment.body == '/describe' ||
            startsWith(github.event.comment.body, '/describe ') ||
            github.event.comment.body == '/improve' ||
            startsWith(github.event.comment.body, '/improve ') ||
            github.event.comment.body == '/ask' ||
            startsWith(github.event.comment.body, '/ask ')
          )
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          config.model: "gemini/gemini-3.6-flash"
          config.fallback_models: '["gemini/gemini-3.5-flash-lite"]'

          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["ready_for_review"]'
